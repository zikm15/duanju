services:
  - type: web
    name: afterglow-preview
    runtime: docker
    repo: https://github.com/zikm15/duanju
    branch: afterglow-v1-preview
    # 免费测试版：不挂载持久盘，运行数据可能随服务重建丢失。
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATA_DIR
        value: /var/data/afterglow
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ADMIN_PASSWORD
        generateValue: true
